name: ci

# The suite is the merge gate. Offline, so nothing green depends on a
# vendor being reachable: the adapter's tests assert the request a batch produces, they do not send
# it. Scripts/run-checks.sh is the whole gate, so a local run and this job prove the same things.

on:
  pull_request:
  push:
    branches: [main]
    # A release tag runs the suite on the tagged commit, and first checks that the CHANGELOG's
    # top heading names that release.
    tags: ['v*']

permissions:
  contents: read

# A new push to a pull request supersedes the run before it, so that run is cancelled. Every other
# run gets a group of its own: GitHub replaces a pending run in a shared group even without
# cancel-in-progress, and no run on main is one to lose.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned, not `macos-latest`: the label moves to a new image on GitHub's schedule, and a
    # toolchain change arriving that way is a red build nobody asked for.
    runs-on: macos-26
    # A wedged suite hangs rather than fails, so cap the job: the default is six hours of nothing.
    # The api-break gate builds four release tags and the working tree on top of the iOS, watchOS,
    # and test builds, so the cap leaves room for all of them cold on three cores.
    timeout-minutes: 30
    strategy:
      # One leg, deliberately. The matrix is here for the name it composes -- `test (macos)` -- so
      # the context a required status check names is platform-qualified before a second leg exists
      # and adding one cannot rename it. Linux is not that leg: the core imports `os` and the
      # adapter imports CryptoKit, so there is nothing to run there.
      matrix:
        os: [macos]
    env:
      # Pinned rather than whatever `xcode-select` points at, for the same reason. Swift tools 6.3
      # is the manifest's floor, so the Xcode that provides it is part of what CI proves.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # Full history: the leak scan's history tier runs with --all, and a shallow (depth-1)
      # checkout would leave it scanning the one fetched commit -- a gate that never fires
      # looks exactly like one that passes. The api-break gate needs the release tags it
      # compares against, which a full-history checkout also fetches.
      # A tag can be moved to other code after review; a commit SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A pin that silently falls back to the image default is a pin that proves nothing, so fail
      # here and print what the image actually has rather than compiling against a surprise.
      - name: verify the toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "pinned Xcode not on this image; available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          swift --version
          # A floor and a ceiling on purpose: 6.3 is the manifest's minimum, and a new major
          # arriving through a changed image should be a deliberate bump, not a silent one.
          swift --version 2>&1 | grep -qE 'Swift version 6\.([3-9]|[1-9][0-9])' || {
            echo "the pinned Xcode does not provide Swift 6.3 or newer"
            exit 1
          }

      - name: release heading
        if: startsWith(github.ref, 'refs/tags/v')
        run: Scripts/check-release-heading.sh "$GITHUB_REF_NAME"

      - name: suite
        run: Scripts/run-checks.sh
