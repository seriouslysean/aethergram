name: ci

# The suite is the merge gate. Offline, so nothing green depends on a
# vendor being reachable: the adapter's tests assert the request a batch produces, they do not send
# it. Scripts/run-checks.sh is the whole gate, so a local run and this job prove the same things.

on:
  pull_request:
  push:
    branches: [main]
    # A release tag runs the suite on the tagged commit, and first checks that the CHANGELOG's
    # top heading names that release.
    tags: ['v*']

permissions:
  contents: read

# A new push to a pull request supersedes the run before it, so that run is cancelled. Every other
# run gets a group of its own: GitHub replaces a pending run in a shared group even without
# cancel-in-progress, and no run on main is one to lose.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned, not `macos-latest`: the label moves to a new image on GitHub's schedule, and a
    # toolchain change arriving that way is a red build nobody asked for.
    runs-on: macos-26
    # A wedged suite hangs rather than fails, so cap the job: the default is six hours of nothing.
    # The api-break gate builds every release tag it compares and the working tree on top of the
    # iOS, watchOS, and test builds, so the cap leaves room for all of them cold on three cores.
    timeout-minutes: 30
    strategy:
      # One leg, deliberately. The matrix is here for the name it composes -- `test (macos)` -- so
      # the context a required status check names is platform-qualified before a second leg exists
      # and adding one cannot rename it. Linux is not that leg: the core imports `os` and the
      # adapter imports CryptoKit, so there is nothing to run there.
      matrix:
        os: [macos]
    env:
      # Pinned rather than whatever `xcode-select` points at, for the same reason. Swift tools 6.3
      # is the manifest's floor, so the Xcode that provides it is part of what CI proves.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # Full history: the leak scan reads the commits between the event's two ends, and a
      # shallow (depth-1) checkout would hold neither. The api-break gate needs the release
      # tags it compares against, which a full-history checkout also fetches.
      # A tag can be moved to other code after review; a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A pin that silently falls back to the image default is a pin that proves nothing, so fail
      # here and print what the image actually has rather than compiling against a surprise.
      - name: verify the toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "pinned Xcode not on this image; available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          swift --version
          # A floor and a ceiling on purpose: 6.3 is the manifest's minimum, and a new major
          # arriving through a changed image should be a deliberate bump, not a silent one.
          swift --version 2>&1 | grep -qE 'Swift version 6\.([3-9]|[1-9][0-9])' || {
            echo "the pinned Xcode does not provide Swift 6.3 or newer"
            exit 1
          }

      - name: release heading
        if: startsWith(github.ref, 'refs/tags/v')
        run: Scripts/check-release-heading.sh "$GITHUB_REF_NAME"

      # The leak scan judges a change on the commits it adds: a pull request's base..head, a
      # push's before..after. A new ref, a tag included, sends an all-zero before, and the scan
      # then reads the pushed commit alone.
      - name: suite
        env:
          LEAK_SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          LEAK_SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: Scripts/run-checks.sh

  # Squash-merges a Dependabot PR once the jobs above pass, if the update is a
  # patch or minor: GitHub's documented pattern (dependabot/fetch-metadata, then
  # gh pr merge), pinned to the head that was checked. Majors and anything not
  # Dependabot's stay open for a person. A new PR job goes in needs: too, or
  # this merges before it finishes.
  automerge:
    name: 'Dependabot auto-merge'
    needs: [test]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Read the update type'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: 'Merge minor and patch updates'
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
